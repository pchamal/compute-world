<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Compute.World">
  <title>Compute.World</title>
  <defs>
    <radialGradient id="orbCore" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#B8F0E0"/>
      <stop offset="28%" stop-color="#3D9BE8"/>
      <stop offset="62%" stop-color="#1F6FBF"/>
      <stop offset="100%" stop-color="#0B3D6E"/>
    </radialGradient>
    <radialGradient id="landHaze" cx="55%" cy="58%" r="55%">
      <stop offset="0%" stop-color="#6FD6A0" stop-opacity=".85"/>
      <stop offset="45%" stop-color="#2FAE7A" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#1A7A5A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="atmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#7EC8FF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#A8E0FF" stop-opacity=".55"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.1"/>
    </filter>
    <filter id="haze" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.4"/>
    </filter>
    <clipPath id="disc"><circle cx="32" cy="32" r="24"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#F3F5F2"/>
  <circle cx="32" cy="32" r="27" fill="#A8D4F0" opacity=".35" filter="url(#haze)"/>
  <circle cx="32" cy="32" r="24" fill="url(#orbCore)"/>
  <g clip-path="url(#disc)" filter="url(#soft)">
    <ellipse cx="22" cy="26" rx="10" ry="7" fill="url(#landHaze)"/>
    <ellipse cx="40" cy="38" rx="12" ry="9" fill="url(#landHaze)" opacity=".9"/>
    <ellipse cx="30" cy="44" rx="14" ry="6" fill="#4CBF8A" opacity=".35"/>
    <ellipse cx="44" cy="22" rx="7" ry="5" fill="#8EE0B8" opacity=".4"/>
  </g>
  <circle cx="32" cy="32" r="24" fill="url(#atmGlow)"/>
  <ellipse cx="24" cy="22" rx="9" ry="5" fill="#FFFFFF" opacity=".28" filter="url(#soft)"/>
  <circle cx="32" cy="32" r="24.6" fill="none" stroke="#5BA8E0" stroke-width="1.2" opacity=".45"/>
</svg>
