name: The Wire
# Two jobs in one workflow:
# 1) Daily at 12:15 UTC: run the collector, commit fresh candidates to wire-inbox.json (human reviews later).
# 2) On any push that changes wire.json: regenerate wire.html + wire.xml so editing the JSON on
#    github.com is all it takes to publish. Cloudflare redeploys on the resulting commit.
on:
  schedule:
    - cron: "15 12 * * *"
  push:
    paths: ["wire.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Collect candidates (scheduled + manual runs only)
        if: github.event_name != 'push'
        run: python3 src/wire_collector.py
      - name: Rebuild wire page + RSS from wire.json
        run: python3 src/build_wire.py
      - name: Commit changes
        run: |
          git config user.name "wire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add wire-inbox.json wire.html wire.xml || true
          git diff --cached --quiet || git commit -m "wire: automated refresh ($(date -u +%Y-%m-%d))"
          git push
