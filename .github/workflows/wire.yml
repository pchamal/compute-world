name: The Wire
# 1) Daily 12:15 UTC: collect candidate signals into wire-inbox.json (human reviews; nothing auto-publishes).
# 2) On any push touching wire.json: regenerate wire.html + wire.xml AND rebuild index.html + data.json,
#    because the Realized Board and the Realized column are computed from Wire signals.
#    Editing wire.json on github.com is therefore the entire publishing workflow.
on:
  schedule:
    - cron: "15 12 * * *"
  push:
    paths: ["wire.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Collect candidates (scheduled + manual runs only)
        if: github.event_name != 'push'
        run: python3 src/wire_collector.py
      - name: Rebuild wire page + RSS from wire.json
        run: python3 src/build_wire.py
      - name: Rebuild index (Realized Board recomputes from Wire signals)
        run: |
          cp wire.json src/wire.json
          cd src && python3 cnw_model.py && python3 build_page.py
          cp deploy/index.html deploy/data.json deploy/sitemap.xml deploy/llms.txt deploy/embed.html deploy/agents.html ..
      - name: Commit changes
        run: |
          git config user.name "wire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add wire-inbox.json wire.html wire.xml index.html data.json sitemap.xml llms.txt embed.html agents.html || true
          git diff --cached --quiet || git commit -m "wire: automated refresh ($(date -u +%Y-%m-%d))"
          git push
