name: The daily tape
# On any push touching brief.json: regenerate brief.html + brief.xml.
# build_brief.py also rebuilds contact.html so The Desk Updated chip
# tracks the same snapshot. Editing the JSON on github.com is the publishing
# workflow; do not invent prices.
on:
  push:
    paths: ["brief.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Rebuild brief from brief.json
        run: python3 src/build_brief.py
      - name: Commit changes
        run: |
          git config user.name "brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add brief.html brief.xml contact.html || true
          git diff --cached --quiet || git commit -m "brief: rebuild daily tape ($(date -u +%Y-%m-%d))"
          # Stash leftovers so rebase can run when another publish pushes first.
          git stash push -u -m "brief-bot leftover" || true
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
          git stash pop || true
