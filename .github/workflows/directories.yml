name: Directory indexes
# On any push touching the three catalogs: regenerate html + xml.
# Editing the JSON on github.com is the publishing workflow; do not invent cities.
on:
  push:
    paths:
      - "inference.json"
      - "neoclouds.json"
      - "hyperscalers.json"
      - "src/build_directory.py"
      - "src/build_inference.py"
      - "src/build_neoclouds.py"
      - "src/build_hyperscalers.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  directories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Rebuild Inference / Neoclouds / Hyperscalers from JSON
        run: |
          python3 src/build_inference.py
          python3 src/build_neoclouds.py
          python3 src/build_hyperscalers.py
      - name: Commit changes
        run: |
          git config user.name "directory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add inference.html inference.xml neoclouds.html neoclouds.xml hyperscalers.html hyperscalers.xml || true
          git diff --cached --quiet || git commit -m "directories: rebuild catalogs ($(date -u +%Y-%m-%d))"
          git push
